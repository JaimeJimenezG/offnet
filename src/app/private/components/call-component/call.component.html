<div class="call-container">
  <div class="header">
    <button class="btn btn-ghost" (click)="goBack()">
      <span class="material-icons-round">arrow_back</span>
      Volver al chat
    </button>
  </div>
  <div class="video-grid">
    <div class="video-wrapper local-video">
      <video #localVideo autoplay playsinline [muted]="'muted'"></video>
      <div class="video-controls">
        @if (!isCallActive) {
          <button class="btn btn-primary" (click)="startCall()">Iniciar Llamada</button>
        } @else {
          <div class="control-buttons">
            <button class="btn" [class.btn-error]="!(isAudioEnabled | async)" (click)="toggleAudio()">
              <span class="material-icons-round">
                {{ (isAudioEnabled | async) ? 'mic' : 'mic_off' }}
              </span>
            </button>
            <button class="btn" [class.btn-error]="!(isVideoEnabled | async)" (click)="toggleVideo()">
              <span class="material-icons-round">
                {{ (isVideoEnabled | async) ? 'videocam' : 'videocam_off' }}
              </span>
            </button>
            <button class="btn btn-error" (click)="endCall()">
              <span class="material-icons-round">call_end</span>
            </button>
          </div>
        }
        @if (incomingCall$ | async) {
          <button class="btn btn-success" (click)="respondCall()">Responder</button>
        }
      </div>
    </div>
    <div class="video-wrapper remote-video">
      <video #remoteVideo autoplay playsinline></video>
    </div>
  </div>
</div>
